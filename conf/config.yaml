hydra:
  mode: RUN
  sweeper:
    params:
      data.graph_type: reply,retweet,mention,late_fuse
      model.encoder: cosine,mlp,gcn,gat,gatv2,gine,sage,transformer,nnconv
  run:
    dir: outputs/singlerun/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

data:
  # Base directory for all extraction runs
  base_dir: ../GraphAnalysis/resources
  # Specific extraction run ID
  run_id: 6bfdd73b5ac511f1bacf010101010000
  
  # Combined path used by the pipeline
  data_dir: ${data.base_dir}/${data.run_id}
  load_graph_if_exists: true
  graph_type: retweet
  split: [0.70, 0.15, 0.15]
  allow_self_loops: false
  max_communities: 100

model:
  encoder: gat
  decoder: mlp
  num_epochs: 50
  learning_rate: 0.0005
  weight_decay: 1e-5
  hidden_dim: 64
  embed_dim: 32
  dropout: 0.1
  neg_ratio: 100.0
  decoder_hidden: 32
  decoder_dropout: 0.1
  scheduler: false
  grad_clip: 0.0
  early_stopping_patience: 20
  seed: 777
  fusion: concat
  batch_size: 512
  num_neighbors: [10, 5]

evaluation:
  neg_ratios: [1, 9, 100]

output:
  base_dir: outputs
  output_dir: ${output.base_dir}/models
  log_dir: ${output.base_dir}/logs
  graph_dir: ${output.base_dir}/graphs/${data.run_id}
  # Fallback to local SQLite if MLFLOW_TRACKING_URI is not set (overridden by env var in main.py)
  mlflow_tracking_uri: ${oc.env:MLFLOW_TRACKING_URI, "sqlite:////mlflow/auth.db"}
  experiment_name: ${oc.env:MLFLOW_EXPERIMENT_NAME, "gnn-link-prediction-v2"}


defaults:
  - config_schema
  - _self_