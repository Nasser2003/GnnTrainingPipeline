hydra:
  mode: RUN
  sweeper:
    params:
      data.graph_type: reply
      model.encoder: gine
      # data.graph_type: reply,retweet,mention,late_fuse
      # model.encoder: cosine,mlp,gcn,gat,gatv2,gine,sage,transformer,nnconv
  run:
    dir: ${data.base_dir}/singlerun/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${data.base_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

data:
  # Base directory for all extraction runs
  base_dir: extraction/outputs
  # Specific extraction run ID
  run_id: f63a692e505d11f1944b08f1eaf4fe18
  
  # Combined path used by the pipeline
  data_dir: ${data.base_dir}/${data.run_id}
  load_graph_if_exists: true
  graph_type: reply
  split: [0.70, 0.15, 0.15]
  max_communities: 100

model:
  encoder: gine
  decoder: mlp
  num_epochs: 200            # Was 50 — too short with early_stopping_patience=15
  learning_rate: 0.0005      # Reduced to avoid the massive oscillations in val_auc
  weight_decay: 5e-4         # Increased for better regularization on small dataset
  hidden_dim: 64             # Reduced to 64 (closer to the 35 input features) to avoid overfitting
  embed_dim: 32              # Reduced to 32
  dropout: 0.4               # Increased to 0.4: tiny communities overfit very quickly
  neg_ratio: 1.0             # Reduced to 1.0 to balance the BCE loss properly
  decoder_hidden: 32         # Reduced to 32
  decoder_dropout: 0.4       # Increased to 0.4
  scheduler: true            # Enable LR decay on plateau — important for community graphs
  grad_clip: 1.0             # Enable gradient clipping — small batches can cause spikes
  early_stopping_patience: 50  # Was 10 — more room before stopping
  seed: 777
  fusion: mean
  batch_size: 1024           # Increased significantly to stabilize gradients (your graph is small enough)
  num_neighbors: [15, 10]    # Was [10, 5] — larger fanout for sparse communities

evaluation:
  neg_ratios: [1, 9, 100]

output:
  base_dir: /app/outputs
  output_dir: ${output.base_dir}/models
  log_dir: ${output.base_dir}/logs
  graph_dir: ${output.base_dir}/graphs
  # Fallback to local SQLite if MLFLOW_TRACKING_URI is not set (overridden by env var in main.py)
  mlflow_tracking_uri: ${oc.env:MLFLOW_TRACKING_URI, "sqlite:///app/outputs/mlflow/mlflow.db"}
  experiment_name: ${oc.env:MLFLOW_EXPERIMENT_NAME, "gnn-link-prediction-v4"}


defaults:
  - config_schema
  - _self_