hydra:
  mode: RUN
  sweeper:
    params:
      data.graph_type: reply
      model.encoder: gcn
      # data.graph_type: reply,retweet,mention,late_fuse
      # model.encoder: cosine,mlp,gcn,gat,gatv2,gine,sage,transformer,nnconv
  run:
    dir: ${data.base_dir}/singlerun/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${data.base_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

data:
  # Base directory for all extraction runs
  base_dir: extraction/outputs
  # Specific extraction run ID
  run_id: f63a692e505d11f1944b08f1eaf4fe18
  
  # Combined path used by the pipeline
  data_dir: ${data.base_dir}/${data.run_id}
  load_graph_if_exists: true
  graph_type: reply
  split: [0.70, 0.15, 0.15]
  allow_self_loops: false
  max_communities: 50

model:
  encoder: none
  decoder: mlp
  num_epochs: 200            # Was 50 — too short with early_stopping_patience=15
  learning_rate: 0.002
  weight_decay: 1e-5
  hidden_dim: 64            # Good for 35 node features (≈4x)
  embed_dim: 64
  dropout: 0.1               # Slightly higher: many small communities → risk of overfitting
  neg_ratio: 1.0             # Was 1.0 — harder negatives help with dense community graphs
  decoder_hidden: 64
  decoder_dropout: 0.1
  scheduler: false            # Enable LR decay on plateau — important for community graphs
  grad_clip: 0             # Enable gradient clipping — small batches can cause spikes
  early_stopping_patience: 100  # Was 10 — more room before stopping
  seed: 777
  fusion: mean
  batch_size: 64            # Was 512 — most communities have <100 nodes; smaller batches fit better
  num_neighbors: [-1, -1]    # Was [10, 5] — larger fanout for sparse communities

evaluation:
  neg_ratios: [1, 9, 100]

output:
  base_dir: /app/outputs
  output_dir: ${output.base_dir}/models
  log_dir: ${output.base_dir}/logs
  graph_dir: ${output.base_dir}/graphs/${data.run_id}
  # Fallback to local SQLite if MLFLOW_TRACKING_URI is not set (overridden by env var in main.py)
  mlflow_tracking_uri: ${oc.env:MLFLOW_TRACKING_URI, "sqlite:///app/outputs/mlflow/mlflow.db"}
  experiment_name: ${oc.env:MLFLOW_EXPERIMENT_NAME, "gnn-link-prediction-experimentations"}


defaults:
  - config_schema
  - _self_