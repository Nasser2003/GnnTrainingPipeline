name: Run Training Pipeline

on:
  push:
    branches:
      - 'exp/*'

# ============================================================================
# GLOBAL ENVIRONMENT — Edit these values to configure the entire pipeline
# ============================================================================
env:
  # --- Pipeline configuration ---
  CONFIG_NAME:         'config_ipazia'
  RUN_ID:              '8cd290e451f511f182c408f1eaf4fe18'
  OVERRIDE_DOWNLOAD:   'false'
  EXPERIMENT_NAME:     'gnn-link-prediction-v4'
  GPU_TIMEOUT:         0      # 0 minutes => Will directly use a CPU whenever the GPU is not available,
                              # 1_000_000 => Will wait until a GPU becomes available

  # --- ipazia server ---
  IPAZIA_HOST:         '160.80.10.21'
  IPAZIA_USER:         'pasquini'
  IPAZIA_SSH_KEY:      '~/.ssh/id_ed25519_ipazia'

  # --- MLflow ---
  MLFLOW_PORT:         5001

  # --- Paths on ipazia (MLflow server + source extraction data) ---
  IPAZIA_MLFLOW_DIR:   '/ipazianas/pasquini/mlflow'
  IPAZIA_EXTRACT_DIR:  '/ipazianas/pasquini/extraction/outputs'

  # --- Paths on the training runner (local data + outputs) ---
  LOCAL_EXTRACT_DIR:   '/data/dpasquini/extraction/outputs'
  LOCAL_TRAINING_DIR:  '/data/dpasquini/training'

  # --- Conda environment name ---
  CONDA_ENV:           'hetero_kg'
  PYTHONUNBUFFERED:    "1"          # Forces Python to flush stdout/stderr immediately
  GPU_MIN_FREE_RATIO:  "0.20"       # Forces to use a GPU with at least 20% free memory

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 — Deploy MLflow + PostgreSQL on the ipazia server
  # ──────────────────────────────────────────────────────────────────────────
  mlflow-deploy:
    name: Deploy MLflow & PostgreSQL (ipazia)
    timeout-minutes: 15
    runs-on:
      - ipazia

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL is Running
        run: |
          # Remove old container if exists, data is safe in the named volume
          podman rm -f mlflow_db 2>/dev/null || true

          # Run PostgreSQL with host network — no rootlessport issues
          podman run -d --name mlflow_db \
            --network host \
            -e POSTGRES_USER=mlflow \
            -e POSTGRES_PASSWORD="${{ secrets.MLFLOW_DB_PASS }}" \
            -e POSTGRES_DB=mlflow_db \
            -v mlflow-pgdata:/var/lib/postgresql/data \
            docker.io/library/postgres:15

          # Wait until PostgreSQL is actually ready
          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 20); do
            podman exec mlflow_db pg_isready -U mlflow && break
            echo "Attempt $i/20 — retrying in 3s..."
            /bin/sleep 3
          done

      - name: Ensure MLflow Server is Running
        run: |
          # 1. Build MLflow auth image if not present
          if ! podman images --format "{{.Repository}}" | grep -Eq "^mlflow-auth$"; then
            podman build -t mlflow-auth -f docker/Dockerfile.mlflow .
          fi

          # 2. Auth config
          mkdir -p ${{ env.IPAZIA_MLFLOW_DIR }}
          if [ ! -f ${{ env.IPAZIA_MLFLOW_DIR }}/auth_config.ini ]; then
            cat <<EOF > ${{ env.IPAZIA_MLFLOW_DIR }}/auth_config.ini
          [mlflow]
          default_permission = READ
          database_uri = sqlite:////mlflow/auth.db
          admin_username = ${{ secrets.MLFLOW_AUTH_USER }}
          admin_password = ${{ secrets.MLFLOW_AUTH_PASS }}
          EOF
          fi

          # 3. Run MLflow with host network — port directly bound by uvicorn, no rootlessport
          podman rm -f mlflow_ui 2>/dev/null || true
          podman run -d --name mlflow_ui \
            --network host \
            -v ${{ env.IPAZIA_MLFLOW_DIR }}:/mlflow:Z \
            -e MLFLOW_AUTH_CONFIG_PATH=/mlflow/auth_config.ini \
            -e MLFLOW_FLASK_SERVER_SECRET_KEY="${{ secrets.MLFLOW_AUTH_KEY }}" \
            -e MLFLOW_HTTP_ALLOW_ALL_HOSTS=true \
            mlflow-auth \
            mlflow server \
              --app-name basic-auth \
              --backend-store-uri "postgresql://mlflow:${{ secrets.MLFLOW_DB_PASS }}@localhost:5432/mlflow_db" \
              --serve-artifacts \
              --artifacts-destination /mlflow/artifacts \
              --default-artifact-root "http://${{ env.IPAZIA_HOST }}:${{ env.MLFLOW_PORT }}/api/2.0/mlflow-artifacts/artifacts" \
              --host 0.0.0.0 \
              --port ${{ env.MLFLOW_PORT }} \
              --allowed-hosts "*" \
              --cors-allowed-origins "*"

          # 4. Wait for MLflow to be ready
          echo "Waiting for MLflow to be ready..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:${{ env.MLFLOW_PORT }}/health && break
            echo "Attempt $i/20 — retrying in 3s..."
            /bin/sleep 3
          done

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 — Download extraction data (optional, runs on training runner)
  # ──────────────────────────────────────────────────────────────────────────
  download-data:
    name: Download Extraction Data (SCP)
    needs: mlflow-deploy
    timeout-minutes: 120
    runs-on: hyperion

    steps:
      - name: Download Data from ipazia via SCP
        run: |
          DEST_DIR="${{ env.LOCAL_EXTRACT_DIR }}/${{ env.RUN_ID }}"
          
          if [ "${{ env.OVERRIDE_DOWNLOAD }}" = "true" ] || [ ! -d "${DEST_DIR}" ] || [ -z "$(ls -A "${DEST_DIR}" 2>/dev/null)" ]; then
            echo "Data needs to be downloaded (OVERRIDE_DOWNLOAD is true OR local data is missing/empty)."
            echo "Creating local destination directory: ${DEST_DIR}"
            mkdir -p "${DEST_DIR}"

            echo "Downloading extraction data for run_id=${{ env.RUN_ID }} from ipazia..."
            scp -i ${{ env.IPAZIA_SSH_KEY }} -r \
              ${{ env.IPAZIA_USER }}@${{ env.IPAZIA_HOST }}:${{ env.IPAZIA_EXTRACT_DIR }}/${{ env.RUN_ID }}/ \
              ${{ env.LOCAL_EXTRACT_DIR }}/

            echo "Download complete. Contents:"
            ls -lh "${DEST_DIR}"
          else
            echo "Local data already exists at ${DEST_DIR} and OVERRIDE_DOWNLOAD is false. Skipping SCP download."
          fi

      - name: Verify Extraction Run ID
        run: |
          DATA_DIR="${{ env.LOCAL_EXTRACT_DIR }}/${{ env.RUN_ID }}"
          echo "Checking extraction directory: ${DATA_DIR} (config: ${{ env.CONFIG_NAME }})"

          if [ -z "${{ env.RUN_ID }}" ]; then
            echo "ERROR: RUN_ID is empty. Provide it via workflow_dispatch input."
            exit 1
          fi

          if [ ! -d "${DATA_DIR}" ]; then
            echo "ERROR: Extraction directory does not exist: ${DATA_DIR}"
            echo "Hint: set override_download=true to fetch it from ipazia via SCP."
            exit 1
          fi

          echo "OK — extraction directory found:"
          ls -lh "${DATA_DIR}"

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 — Setup Dynamic Matrix To run parallar training job 
  # ──────────────────────────────────────────────────────────────────────────
  setup-matrix:
    name: Setup Dynamic Matrix
    runs-on: hyperion
    outputs:
      encoders: ${{ steps.matrix.outputs.encoders }}
      graph_types: ${{ steps.matrix.outputs.graph_types }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Parse Hydra Config
        id: matrix
        run: python .github/scripts/parse_matrix.py

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4 — GNN Training (conda env, training runner)
  # ──────────────────────────────────────────────────────────────────────────
  gnn-training:
    name: Train (${{ matrix.encoder }} - ${{ matrix.graph_type }})
    needs: [download-data, setup-matrix]
    timeout-minutes: 50000  # 34 days max
    runs-on: hyperion
    strategy:
      fail-fast: false
      max-parallel: 4  # Matches the 4 GPUs on hyperion to avoid timeouts
      matrix:
        encoder: ${{ fromJson(needs.setup-matrix.outputs.encoders) }}
        graph_type: ${{ fromJson(needs.setup-matrix.outputs.graph_types) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Output Directories
        run: |
          mkdir -p ${{ env.LOCAL_TRAINING_DIR }}/models
          mkdir -p ${{ env.LOCAL_TRAINING_DIR }}/graphs
          mkdir -p ${{ env.LOCAL_TRAINING_DIR }}/logs
          mkdir -p ${{ env.LOCAL_TRAINING_DIR }}/singlerun
          mkdir -p ${{ env.LOCAL_TRAINING_DIR }}/multirun
          mkdir -p ${{ env.LOCAL_TRAINING_DIR }}/results

      - name: Install Dependencies (conda)
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate ${{ env.CONDA_ENV }}
          pip install -r requirements.txt

      - name: Run GNN Training (conda)
        env:
          DATA_DIR:                 ${{ env.LOCAL_EXTRACT_DIR }}
          MLFLOW_TRACKING_URI:      "http://${{ env.IPAZIA_HOST }}:${{ env.MLFLOW_PORT }}"
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_AUTH_USER }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_AUTH_PASS }}
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate ${{ env.CONDA_ENV }}

          python src/main.py \
            --config-name ${{ env.CONFIG_NAME }} \
            model.encoder=${{ matrix.encoder }} \
            data.graph_type=${{ matrix.graph_type }} \
            data.base_dir=${{ env.LOCAL_EXTRACT_DIR }} \
            data.run_id="${{ env.RUN_ID }}" \
            output.output_dir=${{ env.LOCAL_TRAINING_DIR }}/models \
            output.graph_dir=${{ env.LOCAL_TRAINING_DIR }}/graphs \
            output.log_dir=${{ env.LOCAL_TRAINING_DIR }}/logs \
            output.experiment_name="${{ env.EXPERIMENT_NAME }}" \
            'hydra.run.dir=${{ env.LOCAL_TRAINING_DIR }}/singlerun/${now:%Y-%m-%d}_${now:%H-%M-%S}' \
            'hydra.sweep.dir=${{ env.LOCAL_TRAINING_DIR }}/multirun/${now:%Y-%m-%d}_${now:%H-%M-%S}'

      - name: Print MLflow Tracking URL
        if: always()
        run: |
          echo "=========================================================="
          echo " GNN Training finished! You can access the MLflow UI at:"
          echo " http://${{ env.IPAZIA_HOST }}:${{ env.MLFLOW_PORT }}"
          echo "=========================================================="

