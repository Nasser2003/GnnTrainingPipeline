name: Run Training Pipeline

on:
  push:
    branches:
      - 'exp/*'
  workflow_dispatch:
    inputs:
      config_name:
        description: 'Hydra config name without extension (e.g., config, config_ipazia)'
        required: true
        default: 'config_ipazia'
      run_id:
        description: 'Extraction run_id to train on (overrides value in the config file)'
        required: true
        default: ''

jobs:
  train:
    runs-on: self-hosted
    env:
      CONFIG_NAME: config_ipazia                      # overridden at runtime by Set Global Environment Variables
      RUN_ID: 'a6b91cc04ee511f1a18608f1eaf4fe18'      # overridden at runtime by Set Global Environment Variables

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Global Environment Variables
        run: |
          # Logique de fallback : Input manuel OR default value
          INPUT_CONFIG="${{ github.event.inputs.config_name }}"
          echo "CONFIG_NAME=${INPUT_CONFIG:-config_ipazia}" >> $GITHUB_ENV
          
          INPUT_RUN_ID="${{ github.event.inputs.run_id }}"
          echo "RUN_ID=${INPUT_RUN_ID:-$RUN_ID}" >> $GITHUB_ENV

      - name: Build Podman Image
        run: |
          podman build -t gnn_training -f docker/Dockerfile .

      - name: Prepare Host Directories
        run: |
          mkdir -p /ipazianas/pasquini/training/models \
          mkdir -p /ipazianas/pasquini/training/graphs \
          mkdir -p /ipazianas/pasquini/training/logs \
          mkdir -p /ipazianas/pasquini/training/mlflow/artifacts \
          mkdir -p /ipazianas/pasquini/training/mlflow/postgres_data
          mkdir -p /ipazianas/pasquini/training/singlerun \
          mkdir -p /ipazianas/pasquini/training/multirun \
          mkdir -p /ipazianas/pasquini/training/results \

      - name: Setup MLflow Network
        run: |
          podman network exists mlflow-net || podman network create mlflow-net

      - name: Ensure PostgreSQL is Running
        run: |
          # Clean up old host-networked container (data is safe in the volume)
          podman rm -f mlflow_db 2>/dev/null || true
          
          # Run DB in the dedicated network
          podman run -d --name mlflow_db \
            --network mlflow-net \
            -e POSTGRES_USER=mlflow \
            -e POSTGRES_PASSWORD="${{ secrets.MLFLOW_DB_PASS }}" \
            -e POSTGRES_DB=mlflow_db \
            -v mlflow-pgdata:/var/lib/postgresql/data \
            postgres:15
          echo "Waiting for PostgreSQL to be ready..."
          sleep 10

      - name: Ensure MLflow Server is Running
        run: |
            # 1. Build MLflow auth image
            if ! podman images --format "{{.Repository}}" | grep -Eq "^mlflow-auth$"; then
              podman build -t mlflow-auth -f docker/Dockerfile.mlflow .
            fi

            # 2. Auth config
            mkdir -p /ipazianas/pasquini/mlflow
            if [ ! -f /ipazianas/pasquini/mlflow/auth_config.ini ]; then
              cat <<EOF > /ipazianas/pasquini/mlflow/auth_config.ini
            [mlflow]
            default_permission = READ
            database_uri = sqlite:////mlflow/auth.db
            admin_username = ***
            admin_password = ***
            EOF
            fi

            # 3. Run MLflow Server
            podman run -d --name mlflow_ui --replace \
              --network mlflow-net \
              -p 5001:5000 \
              -v /ipazianas/pasquini/mlflow:/mlflow:Z \
              -e MLFLOW_AUTH_CONFIG_PATH=/mlflow/auth_config.ini \
              -e MLFLOW_FLASK_SERVER_SECRET_KEY="${{ secrets.MLFLOW_AUTH_KEY }}" \
              -e MLFLOW_HTTP_ALLOW_ALL_HOSTS=true \
              mlflow-auth \
              mlflow server \
                --app-name basic-auth \
                --backend-store-uri "postgresql://mlflow:${{ secrets.MLFLOW_DB_PASS }}@mlflow_db:5432/mlflow_db" \
                --default-artifact-root /mlflow/artifacts \
                --host 0.0.0.0 \
                --port 5000 \
                --allowed-hosts "*"

      - name: Verify Extraction Run ID
        run: |
          DATA_DIR="/ipazianas/pasquini/extraction/outputs/${{ env.RUN_ID }}"
          echo "Checking extraction directory: ${DATA_DIR} (config: ${{ env.CONFIG_NAME }})"

          if [ -z "${{ env.RUN_ID }}" ]; then
            echo "ERROR: RUN_ID is empty. Provide it via workflow_dispatch input."
            exit 1
          fi

          if [ ! -d "${DATA_DIR}" ]; then
            echo "ERROR: Extraction directory does not exist: ${DATA_DIR}"
            echo "Run the extraction workflow first with run_id=${{ env.RUN_ID }}."
            exit 1
          fi

          echo "OK — extraction directory found:"
          ls -lh "${DATA_DIR}"

      - name: Run Training Container
        run: |
          # Collect all GPU devices
          DEVICE_FLAGS=()
          for dev in /dev/nvidia* /dev/nvidia-caps/*; do
            [ -b "$dev" ] || [ -c "$dev" ] && DEVICE_FLAGS+=("--device $dev")
          done

          podman run --rm --replace \
            ${DEVICE_FLAGS[@]} \
            --name gnn_training \
            --network host \
            -v /ipazianas/pasquini/extraction/outputs:/app/data:ro \
            -v /ipazianas/pasquini/training:/app/outputs \
            -e "MLFLOW_TRACKING_URI=http://localhost:5000" \
            -e "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_AUTH_USER }}" \
            -e "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_AUTH_PASS }}" \
            -v ${{ github.workspace }}/conf:/app/conf \
            gnn_training \
            --multirun \
            --config-name ${{ env.CONFIG_NAME }} \
            hydra/launcher=joblib \
            hydra.launcher.n_jobs=2 \
            data.run_id="${{ env.RUN_ID }}" \
            output.output_dir=/app/outputs/models \
            output.graph_dir=/app/outputs/graphs \
            output.log_dir=/app/outputs/logs
