name: Run Training Pipeline

on:
  push:
    branches:
      - 'exp/*'
  workflow_dispatch:
    inputs:
      config_name:
        description: 'Hydra config name without extension (e.g., config, config_ipazia)'
        required: true
        default: 'config_ipazia'
      run_id:
        description: 'Extraction run_id to train on (overrides value in the config file)'
        required: false
        default: ''

jobs:
  train:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Podman Image
        run: |
          podman build -t gnn_training -f docker/Dockerfile .

      - name: Prepare Host Directories
        run: |
          mkdir -p /ipazianas/pasquini/training/models \
          /ipazianas/pasquini/training/graphs \
          /ipazianas/pasquini/training/logs \
          /ipazianas/pasquini/training/mlflow/artifacts \
          /ipazianas/pasquini/training/mlflow/postgres_data
          /ipazianas/pasquini/training/singlerun \
          /ipazianas/pasquini/training/multirun \
          /ipazianas/pasquini/training/results \

      - name: Ensure PostgreSQL is Running
        run: |
          if ! podman ps -a --format "{{.Names}}" | grep -Eq "^mlflow_db$"; then
            # First run: create the container and initialize the DB
            podman run -d --name mlflow_db \
              --network host \
              -e POSTGRES_USER=mlflow \
              -e POSTGRES_PASSWORD="${{ secrets.MLFLOW_DB_PASS }}" \
              -e POSTGRES_DB=mlflow_db \
              -v mlflow-pgdata:/var/lib/postgresql/data \
              postgres:15
            echo "Waiting for PostgreSQL to be ready..."
            sleep 15
          elif ! podman ps --format "{{.Names}}" | grep -Eq "^mlflow_db$"; then
            # Container exists but is stopped: restart it, then force-sync the password
            podman start mlflow_db
            sleep 5
          fi

      - name: Ensure MLflow Server is Running
        run: |
            # 1. Build MLflow auth image
            if ! podman images --format "{{.Repository}}" | grep -Eq "^mlflow-auth$"; then
              podman build -t mlflow-auth -f docker/Dockerfile.mlflow .
            fi

            # 2. Auth config
            mkdir -p /ipazianas/pasquini/mlflow
            if [ ! -f /ipazianas/pasquini/mlflow/auth_config.ini ]; then
              cat <<EOF > /ipazianas/pasquini/mlflow/auth_config.ini
            [mlflow]
            default_permission = READ
            database_uri = sqlite:////mlflow/auth.db
            admin_username = ***
            admin_password = ***
            EOF
            fi

            # 3. Run MLflow Server
            podman run -d --name mlflow_ui --replace \
              --network host \
              -v /ipazianas/pasquini/mlflow:/mlflow:Z \
              -e MLFLOW_AUTH_CONFIG_PATH=/mlflow/auth_config.ini \
              -e MLFLOW_FLASK_SERVER_SECRET_KEY="${{ secrets.MLFLOW_AUTH_KEY }}" \
              -e MLFLOW_HTTP_ALLOW_ALL_HOSTS=true \
              mlflow-auth \
              mlflow server \
                --app-name basic-auth \
                --backend-store-uri "postgresql://mlflow:${{ secrets.MLFLOW_DB_PASS }}@127.0.0.1:5432/mlflow_db" \
                --default-artifact-root /mlflow/artifacts \
                --host 0.0.0.0 \
                --port 5000

      - name: Verify Extraction Run ID
        run: |
          CONFIG_NAME="${{ github.event.inputs.config_name || 'config' }}"
          CONFIG_FILE="${{ github.workspace }}/conf/${CONFIG_NAME}.yaml"

          # Use dispatch input if provided, otherwise read from config file
          DISPATCH_RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -n "${DISPATCH_RUN_ID}" ]; then
            RUN_ID="${DISPATCH_RUN_ID}"
            echo "Using run_id from workflow input: ${RUN_ID}"
          else
            RUN_ID=$(grep 'run_id:' "${CONFIG_FILE}" | head -1 | awk '{print $2}' | tr -d '"')
            echo "Using run_id from ${CONFIG_NAME}.yaml: ${RUN_ID}"
          fi

          if [ -z "${RUN_ID}" ]; then
            echo "ERROR: Could not determine run_id. Set it via workflow_dispatch input or in the config file."
            exit 1
          fi

          DATA_DIR="/ipazianas/pasquini/extraction/outputs/${RUN_ID}"
          echo "Checking extraction directory: ${DATA_DIR}"

          if [ ! -d "${DATA_DIR}" ]; then
            echo "ERROR: Extraction directory does not exist: ${DATA_DIR}"
            echo "Run the extraction workflow first with run_id=${RUN_ID}, or update run_id in ${CONFIG_NAME}.yaml."
            exit 1
          fi

          echo "OK — extraction directory found:"
          ls -lh "${DATA_DIR}"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"

      - name: Run Training Container
        run: |
          # Select the config file to use (dispatch input or 'config' fallback for pushes)
          CONFIG_NAME="${{ github.event.inputs.config_name || 'config' }}"

          # Collect all GPU devices
          DEVICE_FLAGS=()
          for dev in /dev/nvidia* /dev/nvidia-caps/*; do
            [ -b "$dev" ] || [ -c "$dev" ] && DEVICE_FLAGS+=("--device $dev")
          done
          
          podman run --rm --replace \
            ${DEVICE_FLAGS[@]} \
            --name gnn_training \
            --network host \
            -v /ipazianas/pasquini/extraction/outputs:/app/data:ro \
            -v /ipazianas/pasquini/training:/app/outputs \
            -e "MLFLOW_TRACKING_URI=http://localhost:5000" \
            -e "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_AUTH_USER }}" \
            -e "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_AUTH_PASS }}" \
            -v ${{ github.workspace }}/conf:/app/conf \
            gnn_training \
            --multirun \
            --config-name $CONFIG_NAME \
            data.run_id="${RUN_ID}" \
            output.output_dir=/app/outputs/models \
            output.graph_dir=/app/outputs/graphs \
            output.log_dir=/app/outputs/logs
